[project]
name = "the-complete-agent-and-mcp-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "anirguha", email = "anirguha@yahoo.com" }
]
requires-python = ">=3.11"
dependencies = [
    "agent-framework>=1.19.0",
    "dotenv>=0.9.9",
    "google-adk>=2.9.2",
    "gradio>=6.26.0",
    "graphviz>=0.21",
    "ipykernel>=7.3.0",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "numpy>=2.4.6",
    "ollama>=0.6.2",
    "openai>=3.5.0",
    "openai-agents>=0.22.0",
    "pandas>=3.0.5",
    "pexpect>=4.9.0",
    "pip>=26.2.1",
    "plotly>=7.1.0",
    "pydantic>=2.13.4",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.3",
    "python-pptx>=1.0.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "ruff>=0.16.4",
    "wikipedia>=1.4.0",
]

[project.scripts]
the-complete-agent-and-mcp-course = "the_complete_agent_and_mcp_course:main"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["agents/*lab*.ipynb"]
[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
