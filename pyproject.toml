[project]
name = "the-complete-agent-and-mcp-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "anirguha", email = "anirguha@yahoo.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "ollama>=0.6.2",
    "openai>=3.5.0",
    "pandas>=3.0.5",
    "pexpect>=4.9.0",
    "pip>=26.2.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "ruff>=0.16.4",
]

[project.scripts]
the-complete-agent-and-mcp-course = "the_complete_agent_and_mcp_course:main"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["agents/*lab*.ipynb"]
[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
