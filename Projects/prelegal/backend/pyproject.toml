[project]
name = "prelegal-backend"
version = "0.1.0"
description = "Prelegal API: serves the frontend, stores users in SQLite and runs the AI chat."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "litellm>=1.106.6",
    "pydantic[email]>=2.14.1",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
