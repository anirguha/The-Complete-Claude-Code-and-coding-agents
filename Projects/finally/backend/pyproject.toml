[project]
name = "finally-backend"
version = "0.1.0"
description = "FinAlly backend: market data, portfolio, chat"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "massive>=2.9,<3",
    "tzdata",
    "litellm>=1.106.6",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
